name: Validate Part 1 - Planning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for required documentation files
      run: |
        required_files=(
          "docs/RaceDay_ERD.png"
          "docs/API_Endpoint_Plan.md"
          "docs/RaceDay_Database.sql"
          "README.md"
        )
        missing_files=()
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            missing_files+=("$file")
            echo " Missing file: $file"
          else
            echo " Found file: $file"
          fi
        done
        if [ ${#missing_files[@]} -ne 0 ]; then
          echo "::error::One or more required files are missing."
          exit 1
        else
          echo " All required planning files are present."
        fi

    - name: Final build status
      run: |
        echo " Part 1 validation complete."